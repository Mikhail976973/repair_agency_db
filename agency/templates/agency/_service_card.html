{% load agency_extras %}
<div class="card service-card h-100 shadow-sm">
  {% if s.image %}
    <img src="{{ s.image.url }}" class="card-img-top" alt="{{ s.name }}">
  {% else %}
    <div class="service-placeholder"><i class="bi bi-tools"></i></div>
  {% endif %}
  <div class="card-body d-flex flex-column">
    <span class="badge text-bg-light align-self-start mb-2">{{ s.category }}</span>
    <h5 class="card-title"><a href="{{ s.get_absolute_url }}">{{ s.name }}</a></h5>
    <p class="mt-auto mb-0 fs-5 fw-bold">{{ s.price|rub }} <small class="text-muted fw-normal">за единицу</small></p>
  </div>
</div>
