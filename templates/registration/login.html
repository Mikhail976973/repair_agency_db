{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
  <div class="widget" style="max-width:420px">
    <h1>Вход</h1>
    {% if form.errors %}<p class="errors">Неверное имя пользователя или пароль.</p>{% endif %}
    {% if next %}<p class="hint">Для этой страницы нужно войти.</p>{% endif %}
    <form method="post" class="login">
      {% csrf_token %}
      <p><label>Имя пользователя<br>{{ form.username }}</label></p>
      <p><label>Пароль<br>{{ form.password }}</label></p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Войти</button>
    </form>
  </div>
{% endblock %}
