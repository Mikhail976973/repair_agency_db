<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Агентство по ремонту квартир{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#f6f6f3}
    header{background:#2b2f26;padding:14px 24px}
    header a{color:#fff;text-decoration:none;font-weight:600}
    main{max-width:960px;margin:24px auto;padding:0 16px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0002}
    .card img{max-width:100%;border-radius:6px}
    .filters a{margin-right:12px}
  </style>
</head>
<body>
  <header><a href="{% url 'agency:service_list' %}">Агентство по ремонту квартир</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
