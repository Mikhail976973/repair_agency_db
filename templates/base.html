<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Агентство по ремонту квартир{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#f6f6f3}
    header{background:#2b2f26;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    header a,header button{color:#fff;text-decoration:none;font-weight:600}
    header nav{display:flex;gap:16px;flex:1}
    .user{color:#d8dccf;font-size:14px;display:flex;align-items:center;gap:12px}
    .user form{margin:0}
    .user button{background:none;border:1px solid #8a9079;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:14px}
    main{max-width:1040px;margin:24px auto;padding:0 16px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0002}
    .card img{max-width:100%;border-radius:6px}
    .filters a{margin-right:12px}
    .widget{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:24px;box-shadow:0 1px 3px #0002}
    .widget h2{margin:0 0 4px}
    .hint{color:#666;font-size:13px;margin:0 0 14px}
    .badge{display:inline-block;font-size:12px;background:#e8eadf;border-radius:10px;padding:2px 9px;margin-left:6px;vertical-align:middle}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .stat{background:#f1f2ec;border-radius:8px;padding:10px 12px}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:12px;color:#666}
    table{border-collapse:collapse;width:100%;font-size:14px}
    th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e6e6e0}
    th{font-size:12px;color:#666;font-weight:600}
    td.num,th.num{text-align:right}
    .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
    code{background:#f1f2ec;border-radius:4px;padding:1px 5px;font-size:12px;word-break:break-word}
    .demo{border-top:1px solid #e6e6e0;padding:10px 0}
    .demo ul{margin:6px 0 0;padding-left:20px;font-size:14px}
    .note{background:#fff7e0;border-radius:8px;padding:10px 14px;margin-bottom:24px}
    .errors{color:#b00020}
    form.login p{margin:10px 0}
    form.login input{padding:7px 9px;font:inherit;width:260px}
    form.login button{padding:8px 18px;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'agency:dashboard' %}">Агентство по ремонту квартир</a>
      <a href="{% url 'agency:service_list' %}">Услуги</a>
      {% if user.is_superuser %}<a href="{% url 'admin:index' %}">Админка</a>{% endif %}
    </nav>
    <div class="user">
      {% if user.is_authenticated %}
        <span>{{ user }} · {% if user.is_superuser %}суперпользователь{% else %}{{ user.get_role_display }}{% endif %}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>
      {% else %}
        <a href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
